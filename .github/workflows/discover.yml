name: Discover ChargeAutomation API

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py
        env:
          CHARGEAUTOMATION_API_KEY: ${{ secrets.CHARGEAUTOMATION_API_KEY }}
